<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Java LocalServer</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a; color: #e2e8f0;
      max-width: 760px; margin: 0 auto; padding: 40px 20px; line-height: 1.6;
    }
    h1 { color: #38bdf8; }
    a { color: #60a5fa; }
    section { background: #1e293b; padding: 20px; border-radius: 12px; margin: 16px 0; }
    code { background: #334155; padding: 2px 6px; border-radius: 4px; }
    button, input[type=submit] {
      background: #38bdf8; color: #0f172a; border: 0; padding: 8px 16px;
      border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    input[type=file] { color: #e2e8f0; }
  </style>
</head>
<body>
  <h1>Java LocalServer</h1>
  <p>A custom HTTP/1.1 server written in pure Java with non-blocking NIO, single-threaded.</p>

  <section>
    <h2>Static content &amp; directory listing</h2>
    <ul>
      <li><a href="/about.html">About page</a></li>
      <li><a href="/uploads/">Uploads directory (listing)</a></li>
    </ul>
  </section>

  <section>
    <h2>File upload (POST multipart)</h2>
    <form action="/uploads" method="POST" enctype="multipart/form-data">
      <input type="file" name="file" required>
      <input type="submit" value="Upload">
    </form>
  </section>

  <section>
    <h2>CGI</h2>
    <ul>
      <li><a href="/cgi-bin/hello.py?name=world">Python CGI (GET with query)</a></li>
    </ul>
  </section>

  <section>
    <h2>Redirect</h2>
    <p><a href="/old">/old</a> redirects to <code>/</code>.</p>
  </section>
</body>
</html>
